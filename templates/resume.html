<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    color: #2b2b2b;
    font-size: 13px;
  }
  html, body { height: 297mm; width: 210mm; }
  .page {
    display: flex;
    height: 297mm;
    width: 210mm;
    overflow: hidden;
  }

  /* ===== Left column - sidebar ===== */
  .sidebar {
    width: 33%;
    background: #eef0f8;
    padding: 32px 24px;
  }
  .contact-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    margin-bottom: 30px;
    word-break: break-word;
  }
  .contact-link {
    color: #3d5a99;
    text-decoration: underline;
  }
  .icon-circle {
    width: 20px;
    height: 20px;
    min-width: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5b5fc7;
  }
  .side-heading {
    color: #3d5a99;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-top: 58px;
    margin-bottom: 22px;
    text-align: center;
  }
  .skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px 6px;
    font-size: 13.5px;
    text-align: center;
    justify-items: center;
  }
  .skills-grid div {
    white-space: nowrap;
  }
  .expertise-list, .languages-list {
    text-align: center;
  }
  .expertise-list div, .languages-list div {
    font-size: 13.5px;
    margin-bottom: 18px;
  }
  .edu-block { font-size: 13.5px; line-height: 1.9; text-align: center; text-wrap: pretty; }
  .edu-degree { font-weight: 700; font-size: 12.5px; white-space: nowrap; }

  /* ===== Right column - main content ===== */
  .main {
    width: 67%;
    padding: 32px 36px;
  }
  .name {
    font-size: 32px;
    font-weight: 300;
    margin: 0 0 12px 0;
    color: #1a1a1a;
  }
  .summary {
    font-size: 14.5px;
    line-height: 1.7;
    margin-bottom: 45px;
    color: #333;
  }
  .main-heading {
    color: #3d5a99;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-top: 45px;
    margin-bottom: 20px;
  }
  .project-block, .job-block {
    margin-bottom: 34px;
  }
  .project-title, .job-title {
    font-size: 14.5px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .project-title a, .job-title a {
    color: #3d5a99;
    font-weight: 400;
    text-decoration: underline;
  }
  ul.bullets {
    margin: 0;
    padding-inline-start: 16px;
  }
  ul.bullets li {
    font-size: 13.5px;
    line-height: 1.7;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
<div class="page">

  <!-- ===== SIDEBAR - fully fixed, never changes between versions ===== -->
  <div class="sidebar">
    <div class="contact-item"><span class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </span><a class="contact-link" href="tel:{{phone_raw}}">{{phone}}</a></div>
    <div class="contact-item"><span class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </span><a class="contact-link" href="mailto:{{email}}">{{email}}</a></div>
    <div class="contact-item"><span class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </span><a class="contact-link" href="https://{{linkedin}}">{{linkedin}}</a></div>
    <div class="contact-item"><span class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </span><a class="contact-link" href="https://{{github}}">{{github}}</a></div>

    <div class="side-heading">TECHNICAL SKILLS</div>
    <div class="skills-grid">
      <!--SKILLS_COL1_SLOT-->
      <!--SKILLS_COL2_SLOT-->
    </div>

    <div class="side-heading">EXPERTISE</div>
    <div class="expertise-list">
      <!--EXPERTISE_SLOT-->
    </div>

    <div class="side-heading">EDUCATION</div>
    <div class="edu-block">
      <div class="edu-degree">{{education.degree}}</div>
      {{education.institution}}.<br>
      Relevant Coursework: {{education.coursework}}
    </div>

    <div class="side-heading">LANGUAGES</div>
    <div class="languages-list">
      <!--LANGUAGES_SLOT-->
    </div>
  </div>

  <!-- ===== MAIN - fixed headings, only the project and experience bullets are injected ===== -->
  <div class="main">
    <div class="name">{{name}}</div>
    <div class="summary">{{summary}}</div>

    <div class="main-heading">PROJECTS</div>
    <!--PROJECTS_SLOT-->

    <div class="main-heading">EXPERIENCE</div>
    <!--EXPERIENCE_SLOT-->
  </div>

</div>
</body>
</html>
